plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captainsss.usershub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.captainsss.usershub'
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
