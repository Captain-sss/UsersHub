plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captainsss.usershub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.captainsss.usershub'
        minSdk 23
        targetSdk 35
        versionCode 151
        versionName '1.5.1'
    }

    signingConfigs {
        release {
            storeFile file('../ci/usershub-release.keystore')
            storePassword 'usershub2026'
            keyAlias 'usershub'
            keyPassword 'usershub2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
