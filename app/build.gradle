plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captainsss.usershub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.captainsss.usershub'
        minSdk 26
        targetSdk 35
        versionCode 190
        versionName '1.9.0'
    }

    signingConfigs {
        release {
            storeFile file('../ci/usershub-release.keystore')
            storePassword 'usershub2026'
            keyAlias 'usershub'
            keyPassword 'usershub2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
