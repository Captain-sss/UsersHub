plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.usershub.freezer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.usershub.freezer'
        minSdk 26
        targetSdk 28
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
